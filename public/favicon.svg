<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2C4A"/>
      <stop offset="100%" style="stop-color:#1A4B6D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#C9A068"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- B Letter with Wave -->
  <text x="50" y="68" font-family="Georgia, serif" font-size="50" font-weight="600" fill="url(#gold)" text-anchor="middle">B</text>
  <!-- Wave accent under -->
  <path d="M25 78 Q35 72 45 78 Q55 84 65 78 Q75 72 75 78" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
